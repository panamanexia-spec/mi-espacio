<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#110d12">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Todo en Orden">
<title>Todo en Orden</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* Diseño «Ciruela»: calma, un solo acento (rosa suave) y una sola tipografía (DM Sans).
   Verde solo para el dinero que entra y rojo suave solo para alertas. Los clientes solo llevan un puntito de color. */
:root{
  color-scheme:dark;
  --bg:#110d12; --surface:#1b161d; --surface2:#241e27; --ink:#f4edf2; --muted:#a597a3; --line:#2b2430;
  --brand:#eaa6c4; --brand-ink:#2a1220; --brand-soft:#2e2030; --brand-t:#eaa6c4;
  --accent:#eaa6c4; --accent-soft:#2e2030; --accent-t:#eaa6c4;
  --ok:#eaa6c4; --ok-soft:#2e2030; --ok-t:#eaa6c4;
  --warn:#eaa6c4; --warn-soft:#2e2030; --warn-t:#eaa6c4;
  --bad:#e88a95; --bad-soft:#3a1d24; --bad-t:#f0a0a9;
  --info:#a597a3; --info-soft:#241e27; --info-t:#c9bdc7;
  --mute:#a597a3; --mute-soft:#241e27; --mute-t:#c9bdc7;
  --pos:#8fd5a6; --c-in:#8fd5a6; --c-out:#7f7080;
  --shadow:none;
  --focus:#f4edf2;
  --r:16px; --r-sm:12px;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-display:var(--f-body);
  --sec:var(--brand); --sec-ink:var(--brand-ink);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#faf6f9; --surface:#ffffff; --surface2:#f5eef3; --ink:#2a2128; --muted:#6c5e69; --line:#eadfe7;
  --brand:#a23d6b; --brand-ink:#ffffff; --brand-soft:#f6e3ec; --brand-t:#a23d6b;
  --accent:#a23d6b; --accent-soft:#f6e3ec; --accent-t:#a23d6b;
  --ok:#a23d6b; --ok-soft:#f6e3ec; --ok-t:#a23d6b;
  --warn:#a23d6b; --warn-soft:#f6e3ec; --warn-t:#a23d6b;
  --bad:#b3263f; --bad-soft:#f9e0e5; --bad-t:#b3263f;
  --info:#6c5e69; --info-soft:#f5eef3; --info-t:#52444f;
  --mute:#6c5e69; --mute-soft:#f5eef3; --mute-t:#52444f;
  --pos:#1f7a46; --c-in:#1f7a46; --c-out:#9a8a97;
  --shadow:none;
  --focus:#2a2128;
}
@media (prefers-color-scheme: light){
  :root[data-theme="auto"]{
  color-scheme:light;
  --bg:#faf6f9; --surface:#ffffff; --surface2:#f5eef3; --ink:#2a2128; --muted:#6c5e69; --line:#eadfe7;
  --brand:#a23d6b; --brand-ink:#ffffff; --brand-soft:#f6e3ec; --brand-t:#a23d6b;
  --accent:#a23d6b; --accent-soft:#f6e3ec; --accent-t:#a23d6b;
  --ok:#a23d6b; --ok-soft:#f6e3ec; --ok-t:#a23d6b;
  --warn:#a23d6b; --warn-soft:#f6e3ec; --warn-t:#a23d6b;
  --bad:#b3263f; --bad-soft:#f9e0e5; --bad-t:#b3263f;
  --info:#6c5e69; --info-soft:#f5eef3; --info-t:#52444f;
  --mute:#6c5e69; --mute-soft:#f5eef3; --mute-t:#52444f;
  --pos:#1f7a46; --c-in:#1f7a46; --c-out:#9a8a97;
  --shadow:none;
  --focus:#2a2128;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--f-body);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
ul{list-style:none;margin:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:100}
.skip:focus{top:12px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- estructura ---------- */
.side{display:none}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-size:1.25rem;font-weight:700;display:flex;align-items:center;gap:10px}
.brand i{width:30px;height:30px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-style:normal;font-size:.95rem}
main{padding:20px 16px 120px;max-width:1120px;margin:0 auto;outline:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button,.side nav button{position:relative}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:14px;font-size:.75rem;font-weight:600;color:var(--muted);min-height:56px}
.tabs button[aria-current="page"]{color:var(--brand-t);background:var(--brand-soft)}
.badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;padding:0 5px;font-style:normal}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge{color:#2a0a12}}
:root[data-theme="dark"] .badge{color:#2a0a12}
@media (min-width:900px){
  body{display:grid;grid-template-columns:260px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;padding:28px 16px;background:var(--surface);border-right:1px solid var(--line)}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-weight:600;color:var(--muted);text-align:left;min-height:48px}
  .side nav button:hover{background:var(--surface2)}
  .side nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-t)}
  .side .badge{position:static;margin-left:auto}
  .side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .bar,.tabs{display:none}
  main{padding:36px 44px 60px;width:100%}
}

/* ---------- componentes ---------- */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.eyebrow{font-size:.92rem;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);margin:0 0 2px}
.page-head h1{font-size:clamp(1.7rem,4vw,2.4rem)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:span 2}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card>h2,.card-h h2{font-size:1.2rem}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.card>h2{margin-bottom:12px}
.link{color:var(--brand-t);font-weight:700;font-size:.9rem;text-decoration:underline;text-underline-offset:3px;min-height:44px;min-width:44px;justify-content:center;display:inline-flex;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;font-weight:700;background:var(--brand);color:var(--brand-ink);border:2px solid var(--brand)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--brand-t);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{background:transparent;color:var(--bad-t);border-color:var(--bad)}
.btn.sm{min-height:44px;padding:0 14px;font-size:.9rem}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--ps);color:var(--pt);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pt)}
.k-brand{--ps:var(--brand-soft);--pt:var(--brand-t)}.k-accent{--ps:var(--accent-soft);--pt:var(--accent-t)}
.k-ok{--ps:var(--ok-soft);--pt:var(--ok-t)}.k-warn{--ps:var(--warn-soft);--pt:var(--warn-t)}
.k-bad{--ps:var(--bad-soft);--pt:var(--bad-t)}.k-info{--ps:var(--info-soft);--pt:var(--info-t)}.k-mute{--ps:var(--mute-soft);--pt:var(--mute-t)}
.syncbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-weight:600;color:var(--muted)}
.syncbtn[data-s="ok"]{color:var(--ok-t)}.syncbtn[data-s="err"]{color:var(--bad-t);border-color:var(--bad)}
.syncbtn[data-s="busy"] svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:var(--r-sm);padding:12px 14px;min-width:0}
.stat span{display:block;font-size:.8rem;font-weight:600;color:var(--muted)}
.stat b{display:block;font-family:var(--f-display);font-size:clamp(1.15rem,2vw,1.4rem);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.card{background:var(--surface)}
.pos{color:var(--ok-t)}.neg{color:var(--bad-t)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0;text-align:left;border-radius:10px;padding:2px 0;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.row-main .t{font-weight:600;overflow-wrap:anywhere}
.row-main .s{font-size:.88rem;color:var(--muted)}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:var(--brand-ink);position:relative}
.chk::after{content:"";position:absolute;inset:-8px}
.chk[aria-checked="true"]{background:var(--brand);border-color:var(--brand)}
.chk svg{width:16px;height:16px;stroke-width:3}
.empty{color:var(--muted);padding:14px 0;text-align:center}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:var(--mute-soft);color:var(--mute-t);flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px;max-width:100%}
.seg button{min-height:44px;padding:0 18px;border-radius:999px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.subtabs button{min-height:46px;padding:0 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--brand-t);border-color:var(--brand)}
.gh{font-size:.9rem;font-weight:600;color:var(--muted);margin:14px 0 2px}
.mnav{display:flex;align-items:center;gap:10px}
.mnav b{font-family:var(--f-display);font-size:1.2rem;font-weight:600;text-transform:capitalize;min-width:9ch;text-align:center}
.note{font-size:.9rem;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin-bottom:4px}
.btn.big{width:100%;min-height:56px;font-size:1.05rem;margin-bottom:18px}
.clist{display:grid;gap:10px}
.cli{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);text-align:left}
.cli .row-main{display:flex;flex-direction:column;flex:1;min-width:0}
.cli>svg{flex:none;color:var(--muted)}
.cs{margin-bottom:16px}
.more{margin:6px 0 14px;border:1px dashed var(--line);border-radius:var(--r-sm);padding:10px 14px}
.more summary{font-weight:700;color:var(--brand-t);min-height:44px;display:flex;align-items:center}
.kv{display:flex;gap:14px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);font-weight:500;flex:none}
.kv .v{font-weight:600;text-align:right;overflow-wrap:anywhere;white-space:pre-wrap;min-width:0}
.lk{color:var(--brand-t);font-weight:700;text-decoration:underline;text-underline-offset:3px}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .wd{font-size:.78rem;font-weight:700;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1;min-height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface2)}
.day.out{visibility:hidden}
.day.today{outline:2px solid var(--brand);outline-offset:-2px}
.day[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--brand)}
.dots .d-brand{background:#eaa6c4}.dots .d-accent{background:#b9a4e8}.dots .d-info{background:#9db8e8}.dots .d-warn{background:#e9bd73}.dots .d-bad{background:#e88a95}.dots .d-mute{background:var(--muted)}
.day[aria-pressed="true"] .dots i{background:var(--brand-ink)}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.split{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
/* medidor de presupuesto */
.meter{position:relative;height:14px;border-radius:9px;background:var(--mute-soft);margin:10px 0 8px}
.meter i{display:block;height:100%;border-radius:9px;background:var(--ok)}
.meter.warn i{background:var(--warn)}.meter.bad i{background:var(--bad)}
.meter u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.6}
.bars .b{margin-bottom:12px;font-weight:600;font-size:.95rem}
.bars .b>div:first-child{display:flex;justify-content:space-between;gap:8px}
.bars .track{height:10px;border-radius:6px;background:var(--mute-soft);margin-top:5px;overflow:hidden}
.bars .track i{display:block;height:100%;border-radius:6px 0 0 6px;background:var(--brand)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body);font-variant-numeric:tabular-nums}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .bi{fill:var(--c-in)}.chart .bo{fill:var(--c-out)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;font-weight:600;margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left;text-transform:capitalize}
table.t th{color:var(--muted);font-weight:600;font-size:.8rem}
.scroll-x{overflow-x:auto}
/* contenido (feed) */
.board{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.col h3{font-size:1rem;display:flex;align-items:center;gap:8px;margin-bottom:10px;font-family:var(--f-body)}
.post{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);margin-bottom:8px;flex-wrap:wrap}
.post .row-main{min-width:120px}
.thumb{width:52px;height:64px;border-radius:10px;background:var(--surface2) center/cover;flex:none;border:1px solid var(--line)}
.ideas{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.idea{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;min-width:0}
.idea .open{display:block;width:100%;text-align:left;padding-right:44px;min-height:60px}
.idea h3{font-size:1.05rem;margin-bottom:4px}
.idea p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.92rem;color:var(--muted)}
.idea .star{position:absolute;top:4px;right:4px;width:44px;height:44px;display:grid;place-items:center;color:var(--muted)}
.idea .star[aria-pressed="true"]{color:var(--warn)}
.idea .star[aria-pressed="true"] svg{fill:currentColor}
.al{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line);min-height:48px}
li:last-child>.al{border:0}
.al svg{color:var(--brand-t)}
.al.l2 .tx,.al.l3 .tx{font-weight:700}
/* hoja / diálogo */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.open{display:block}
#sheet .back{position:absolute;inset:0;background:rgba(30,12,22,.55)}
#sheet .panel{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,580px);max-height:92vh;overflow:auto;background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media (min-width:700px){#sheet .panel{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:24px;max-height:88vh}}
.panel h2{font-size:1.5rem;margin-bottom:14px}
.f{display:block;margin-bottom:14px}
.f>span{display:block;font-size:.88rem;font-weight:700;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);min-height:48px;padding:10px 14px;border-radius:var(--r-sm);border:1.5px solid var(--muted);background:var(--bg);appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
textarea{min-height:90px;resize:vertical}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btns .btn{flex:1;min-width:120px}
.quick{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.quick input{flex:1;min-width:160px}.quick select{width:auto;min-width:150px}
.strip{display:flex;gap:10px;overflow-x:auto;padding:10px 8px 10px}
.strip button.th{position:relative;flex:none;width:76px;height:96px;border-radius:12px;background:var(--surface2) center/cover;border:3px solid transparent}

<script>
/* ============ Datos ============ */
const KEY='miespacio.v1';
const DEF={events:[],tx:[],shop:[],clients:[],tasks:[],ideas:[],posts:[],goals:[],debts:[],bills:[],inbox:[],favs:[],del:{},set:{name:'',budget:0,caps:{},balS:0,balSd:'',balE:0,balEd:'',alertPct:80,leadDays:'3,1,0',u:0,seeded:false}};
const COLL=['events','tx','shop','clients','tasks','ideas','posts','goals','debts','bills','inbox'];
let S;
/* Todo dato que viene de fuera (almacenamiento, respaldo importado, GitHub) se limpia antes de usarse */
const SAFE=/^[\w-]{1,64}$/,isD=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v),isT=v=>typeof v==='string'&&/^\d{2}:\d{2}$/.test(v);
const TEXTF=['title','name','note','desc','caption','tags','feedback','link','handle','contact','notes','qty','cat','project','clientId','format','status','important','web','instagram','tiktok','facebook','linkedin','youtube','otras','otroTxt','card'];
function pmOf(o){const n=String(o.payWeekdays||(o.payWeekday==null?5:o.payWeekday)).split(',').filter(x=>x!=='').length||1;return o.freq==='quincenal'?2:o.freq==='semanal'?n*52/12:1}
function cleanRec(c,r){
  if(!r||typeof r!=='object'||Array.isArray(r)||typeof r.id!=='string'||!SAFE.test(r.id))return null;
  const o={...r};
  TEXTF.forEach(k=>{if(k in o&&typeof o[k]!=='string')o[k]=o[k]==null||typeof o[k]==='object'?'':String(o[k])});
  ['date','due','payFrom','for','created','doneOn','since','end'].forEach(k=>{if(k in o&&o[k]!==''&&!isD(o[k]))o[k]=''});
  if('time' in o&&o.time!==''&&!isT(o.time))o.time='';
  if('u' in o&&!Number.isFinite(o.u))delete o.u;
  if(c==='events'){if(!isD(o.date))return null;if(!['ninguna','diaria','semanal','mensual','anual'].includes(o.repeat))o.repeat='ninguna';if(!o.doneOn||typeof o.doneOn!=='object'||Array.isArray(o.doneOn))o.doneOn={}}
  if(c==='inbox'){o.type=o.type==='ingreso'?'ingreso':'gasto';o.amount=+o.amount;if(!(o.amount>0&&o.amount<1e7))return null;o.desc=String(o.desc||'').slice(0,80);o.card=String(o.card||'').slice(0,30);o.cat=String(o.cat||'').slice(0,40);if(o.date&&!isD(o.date))o.date=''}
  if(c==='goals'){o.target=Number.isFinite(+o.target)&&+o.target>0?+o.target:0;o.done=!!o.done;o.final=Number.isFinite(+o.final)?+o.final:0;o.aportes=Number.isInteger(+o.aportes)&&+o.aportes>=0?+o.aportes:0}
  if(c==='bills'){o.amt=Number.isFinite(+o.amt)&&+o.amt>=0&&+o.amt<1e9?+o.amt:0;if(!['15','fin','dia'].includes(o.when))o.when='15';o.day=Number.isInteger(+o.day)&&+o.day>=1&&+o.day<=31?+o.day:1;if(!['quincenal','mensual','bimestral'].includes(o.freq))o.freq='mensual';if(!['si','no'].includes(o.payroll))o.payroll='no';if(o.active!=='no')o.active='si';if(!isD(o.from))o.from=ymd0();if(o.varia!=='si')delete o.varia;if(Number.isInteger(+o.lim)&&+o.lim>=1&&+o.lim<=31)o.lim=+o.lim;else delete o.lim;if(o.split==='si'&&Number.isFinite(+o.part1)&&+o.part1>0&&+o.part1<o.amt)o.part1=+o.part1;else{delete o.split;delete o.part1}if(typeof o.lg!=='string'||!SAFE.test(o.lg))delete o.lg}
  if(c==='debts'){['bal','rate','pay','init'].forEach(k=>{o[k]=Number.isFinite(+o[k])&&+o[k]>=0&&+o[k]<1e9?+o[k]:0});o.rate=Math.min(o.rate,1000);if(!(o.init>=o.bal))o.init=o.bal;if(!['si','no'].includes(o.payroll))o.payroll='no';if(o.late!=='si')o.late='no';if(o.bank!=='si')delete o.bank;if(Number.isFinite(+o.ded)&&+o.ded>0&&+o.ded<1e7)o.ded=+o.ded;else{delete o.ded;delete o.dedFrom}if(o.dedFrom&&!isD(o.dedFrom))delete o.dedFrom;
    o.adj=Array.isArray(o.adj)?o.adj.slice(-120).map(x=>x&&typeof x==='object'&&isD(x.d)&&Number.isFinite(+x.b)&&+x.b>=0&&+x.b<1e9?{d:x.d,b:+x.b}:null).filter(Boolean):[];if(!o.adj.length)delete o.adj;
    o.pays=Array.isArray(o.pays)?o.pays.slice(0,500).map((p,i)=>p&&typeof p==='object'&&isD(p.d)&&Number.isFinite(+p.a)&&+p.a>0&&+p.a<1e9?{id:typeof p.id==='string'&&SAFE.test(p.id)?p.id:'p'+i,d:p.d,a:+p.a,k:p.k==='extra'?'extra':p.k==='plan'?'plan':'cuota',...(p.x?{x:1}:{}),cap:Number.isFinite(+p.cap)&&+p.cap>=0?+p.cap:0,...(typeof p.tx==='string'&&SAFE.test(p.tx)?{tx:p.tx}:{})}:null).filter(Boolean):[]}
  if(c==='clients'){
    if(!['mensual','quincenal','semanal'].includes(o.freq))delete o.freq;
    if(o.payWeekdays!=null&&!/^[0-6](,[0-6])*$/.test(String(o.payWeekdays)))delete o.payWeekdays;
    if(o.payWeekdays==null&&o.payWeekday!=null&&String(o.payWeekday)!==''&&Number.isInteger(+o.payWeekday)&&+o.payWeekday>=0&&+o.payWeekday<=6)o.payWeekdays=String(+o.payWeekday);
    delete o.payWeekday;
    if(!(Number.isInteger(+o.payDay)&&+o.payDay>=1&&+o.payDay<=31))delete o.payDay;
    if(o.tipo==='planilla')o.tipo='salario';
    else if(o.tipo==='extra'){o.tipo='otro';if(!o.otroTxt)o.otroTxt='Ingreso extra'}
    else if(!['salario','ofrenda','otro'].includes(o.tipo)){delete o.tipo;if(+o.fee>0){o.tipo='otro';if(!o.otroTxt)o.otroTxt='Ingreso'}}
    if(o.feeBase){const pm=pmOf(o),f=+o.fee;if(f>0){if(o.tipo==='salario'&&o.feeBase==='pago')o.fee=Math.round(f*pm*100)/100;else if(o.tipo!=='salario'&&o.feeBase==='mes')o.fee=Math.round(f/pm*100)/100}delete o.feeBase}
    if(!['si','no'].includes(o.auto))delete o.auto;
    if(o.bonusOn!=='si')o.bonusOn='no';

  if(ev.repeat==='anual')return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth();

}

/* periodos de cobro de una fuente: los últimos 8 vencidos o pagados y los 2 siguientes */
function periods(c,sk='main'){

  const fee=sm.fee,o=sm.o,t=today(),from=payStart(c);
  const past=dueDates(o,from,t),fut=dueDates(o,addDays(t,1),addDays(t,45)).slice(0,2);
  const all=[...past.slice(-8),...fut],paidBy=paidMap(c,sk,dueDates(o,addDays(from,-20),addDays(t,60)),from);
  return all.map(due=>{const f=sm.feeAt?sm.feeAt(due):fee,paid=paidBy[due]||0,falta=Math.max(0,f-paid);
    const st=paid>=f-0.005?'pagado':due<t?'vencido':due===t?'hoy':'proximo';

  return {fee:payAmt(c),gross:grossPay(c),descPay:descMonth(c)/perMonth(c),plan:isSal(c),P,overdue,pend:overdue.reduce((a,p)=>a+p.falta,0),next:P.find(p=>p.st==='proximo'),paid};

function win(ym,per){const [y,m]=ym.split('-').map(Number),ld=lastDay(y,m);return per==='q1'?[ym+'-01',ym+'-15']:per==='q2'?[ym+'-16',`${ym}-${pad(ld)}`]:[ym+'-01',`${ym}-${pad(ld)}`]}
const perLabel=(ym,per)=>{const [a,b]=win(ym,per);return per==='mes'?mLabel(ym):`${+a.slice(8)} al ${+b.slice(8)} de ${MESES[+ym.slice(5)-1]}`};
function cobrosEn(ym,per){
  const [a,b]=win(ym,per);let esperado=0,cobrado=0;const rows=[];
  S.clients.filter(c=>c.status==='Activo').forEach(c=>{
    let n=0,e=0,r=0;const from=payStart(c);

function incSrc(t){if(t.stream==='bono')return 'extra';const c=S.clients.find(x=>x.name===t.cat);return c&&isSal(c)?'salario':'extra'}
/* bolsillo = saldo inicial + lo cobrado − lo gastado − lo ahorrado, desde su fecha de inicio y hasta hoy */
function pocket(w){
  const t=today(),ini=num(S.set[w==='salario'?'balS':'balE']),d0=S.set[w==='salario'?'balSd':'balEd']||'';
  const ok=x=>x.date<=t&&(!d0||x.date>=d0),sum=f=>S.tx.filter(x=>ok(x)&&f(x)).reduce((a,x)=>a+x.amount,0);
  const inc=sum(x=>x.type==='ingreso'&&incSrc(x)===w);
  let out=sum(x=>x.type==='gasto'&&srcOf(x)===w);const sav=sum(x=>x.type==='ahorro'&&srcOf(x)===w);
  if(w==='extra')out+=S.debts.reduce((a,d)=>a+d.pays.filter(p=>p.x&&!p.tx&&p.d<=t&&(!d0||p.d>=d0)).reduce((q,p)=>q+p.a,0),0);
  return {ini,d0,inc,out,sav,avail:r2(ini+inc-out-sav)};

/* pagos programados: cada ocurrencia se confirma con un check que crea el gasto real */
const billTxId=(b,d)=>b.id.slice(0,40)+'-'+d.replace(/-/g,'');
function billDates(b,from,to){
  const out=[],fy=+b.from.slice(0,4),fm=+b.from.slice(5,7);let y=+from.slice(0,4),m=+from.slice(5,7);
  while(`${y}-${pad(m)}`<=to.slice(0,7)){
    const ld=lastDay(y,m);let days;
    if(b.freq==='quincenal')days=[15,ld];
    else if(b.freq==='bimestral'&&((y*12+m)-(fy*12+fm))%2!==0)days=[];
    else days=[b.when==='15'?15:b.when==='fin'?ld:Math.min(Math.max(1,b.day||1),ld)];
    days.forEach(dd=>{const x=`${y}-${pad(m)}-${pad(dd)}`;if(x>=from&&x<=to&&x>=b.from)out.push(x)});
    m++;if(m>12){m=1;y++}
  }
  return out;
}
const billPaid=(b,d)=>S.tx.find(x=>x.id===billTxId(b,d))||(b.lg&&S.tx.find(x=>(x.id===b.lg&&d===b.from)||(x.from===b.lg&&x.date===d)))||null;
/* fecha límite: el día `lim` de ese mes (o del siguiente si ya pasó el día de pago) */
const billLimit=(b,d)=>{if(!b.lim)return '';let y=+d.slice(0,4),m=+d.slice(5,7);if(b.lim<+d.slice(8)){m++;if(m>12){m=1;y++}}return `${y}-${pad(m)}-${pad(Math.min(b.lim,lastDay(y,m)))}`};

function billItems(from,to){

  S.bills.filter(b=>b.active!=='no'&&b.payroll!=='si').forEach(b=>billDates(b,from,to).forEach(d=>{
    const tx=billPaid(b,d),lim=billLimit(b,d),end=lim||d;
    out.push({b,date:d,lim,tx,paid:!!tx,ap:splitOk(b)&&d>t?b.part1:b.amt,st:tx?'pagado':end<t?'vencido':d<t?'toca':d===t?'hoy':'proximo'});
  }));

}

/* próxima fecha de cobro del salario (15 o fin de mes, según tus clientes de salario) */
function nextPay(){

  S.clients.filter(c=>isSal(c)&&num(c.fee)>0&&c.status!=='Terminado').forEach(c=>{const n=periods(c,'main').find(p=>p.due>=t&&p.st!=='pagado');if(n&&(!best||n.due<best))best=n.due});
  if(!best){const y=+t.slice(0,4),m=+t.slice(5,7);for(const d of [`${y}-${pad(m)}-15`,`${y}-${pad(m)}-${pad(lastDay(y,m))}`,`${m===12?y+1:y}-${pad(m===12?1:m+1)}-15`])if(d>=t){best=d;break}}
  return best;

/* Hoy puedes gastar = (disponible del salario − pagos sin check que vencen hasta el próximo cobro) ÷ días hasta ese cobro */
function cuenta(){

  const items=billItems(addDays(t,-60),next).filter(i=>!i.paid),apart=items.reduce((a,i)=>a+i.ap,0),net=r2(pk.avail-apart);
  return {pk,next,days,items,apart,net,per:net>0?net/days:0,falta:net<0?-net:0};

/* salario por quincena: neto de la del 15 y de la de fin de mes, con desglose */
function salCols(ym){
  const ld=lastDay(+ym.slice(0,4),+ym.slice(5,7)),cols=[0,1].map(()=>({gross:0,ss:0,se:0,descs:{},comm:0,net:0,n:0}));
  S.clients.filter(c=>isSal(c)&&num(c.fee)>0&&c.status!=='Terminado').forEach(c=>streams(c).forEach(sm=>{
    if(sm.k!=='main'&&sm.k!=='comm')return;
    dueDates(sm.o,`${ym}-01`,`${ym}-${pad(ld)}`).forEach(d=>{
      const col=cols[+d.slice(8)<=15?0:1];col.n++;
      if(sm.k==='main'){const g=grossPay(c),pm=perMonth(c);col.gross+=g;col.ss+=g*.0975;col.se+=g*.0125;descsOf(c,d).forEach(x=>{const k=x.n||'Descuento';col.descs[k]=(col.descs[k]||0)+num(x.m)*2/pm});col.net+=payAmtAt(c,d)}
      else{col.comm+=sm.fee;col.net+=sm.fee}
    });
  }));
  return cols;
}

const niceMax=m=>{const p=10**Math.floor(Math.log10(m)),n=m/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p};
const fmtK=v=>v>=1000?((v/1000).toFixed(v%1000?1:0))+'k':String(Math.round(v));
function chartMonths(ym){
  const ms=[];for(let i=5;i>=0;i--)ms.push(shiftM(ym,-i));
  const data=ms.map(m=>{const t=totals(m);return {m,i:t.ingreso,g:t.gasto}});
  if(!data.some(d=>d.i||d.g))return `<p class="empty">Cuando registres movimientos verás aquí la comparación de los últimos 6 meses.</p>`;
  const top=niceMax(Math.max(1,...data.flatMap(d=>[d.i,d.g])));
  const W=640,H=250,pl=44,pr=8,pt=16,pb=30,iw=W-pl-pr,ih=H-pt-pb,band=iw/6,bw=Math.min(30,band/2.7);
  let g='';
  for(let k=0;k<=4;k++){const y=pt+ih-ih*k/4;g+=`<line class="g" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmtK(top*k/4)}</text>`}

/* una deuda: meses y total de intereses pagando la cuota (+ abono extra) cada mes */
function simDebt(bal,rate,pay,extra=0){
  const r=rate/1200,p=pay+extra;let b=bal,m=0,int=0;
  if(!(b>0.005))return {ok:true,m:0,int:0};
  while(b>0.005&&m<1200){const i=b*r;if(p<=i+1e-9)return {ok:false,m:0,int:0};int+=i;b+=i;b-=Math.min(p,b);m++}
  return {ok:b<=0.005,m,int};
}
/* varias deudas: lo que sobra al liquidar una pasa a la siguiente (según el orden del método) */
function simPlan(list,extra,order){
  const D=list.map(d=>({id:d.id,name:d.name,rate:d.rate,pay:d.pay,b:d.bal,m:0,done:false}));
  const total=D.reduce((a,d)=>a+d.pay,0)+extra;let months=0,int=0;
  while(D.some(d=>!d.done)&&months<1200){
    months++;
    D.forEach(d=>{if(!d.done){const i=d.b*d.rate/1200;d.b+=i;int+=i}});
    let pool=total;
    D.forEach(d=>{if(!d.done){const p=Math.min(d.pay,d.b);d.b-=p;pool-=p}});
    for(const d of D.filter(d=>!d.done&&d.b>0.005).sort(order)){if(pool<=0)break;const p=Math.min(pool,d.b);d.b-=p;pool-=p}
    D.forEach(d=>{if(!d.done&&d.b<=0.005){d.done=true;d.b=0;d.m=months}});
  }
  return {months,int,ok:D.every(d=>d.done),D};
}

/* descuento de planilla fijo: cada 15 y fin de mes se anota un pago a la deuda y el gasto en tu salario (ids fijos: no se duplica) */
function applyDebtDeductions(){
  let n=0;const t=today();
  S.debts.forEach(d=>{
    if(!(d.ded>0)||!d.dedFrom||d.payroll!=='si')return;
    const to=d.end&&d.end<t?d.end:t;
    for(let y=+d.dedFrom.slice(0,4),m=+d.dedFrom.slice(5,7);`${y}-${pad(m)}`<=to.slice(0,7);){
      [15,lastDay(y,m)].forEach(dd=>{
        const date=`${y}-${pad(m)}-${pad(dd)}`;if(date<d.dedFrom||date>to)return;
        const id=`${d.id.slice(0,30)}-d${date.replace(/-/g,'')}`;
        if(d.pays.some(p=>p.id===id)||S.del[id]||S.tx.some(x=>x.id===id))return;
        const cap=d.bank==='si'?0:r2(Math.min(d.bal,d.ded));
        S.tx.push({id,type:'gasto',amount:d.ded,cat:'Deudas',desc:'Descuento planilla: '+d.name,date});
        d.pays.unshift({id,d:date,a:d.ded,k:'plan',cap,tx:id});d.pays=d.pays.slice(0,500);d.bal=r2(d.bal-cap);n++;
      });
      m++;if(m>12){m=1;y++}
    }
  });
  if(n){stamp();persist();autoSync()}
}

/* Fondo de emergencia: ahorros con la categoría «Emergencia». Escalón 1 = $300; escalón 2 = 1 mes de gastos (fijos + cuotas que paga ella + promedio del día a día de los últimos 3 meses) */
const EM1=300;
function emergInfo(){
  const saved=S.tx.filter(t=>t.type==='ahorro'&&t.cat==='Emergencia').reduce((a,t)=>a+t.amount,0);
  const fixed=billsMonthly()+debtsInfo().mine;
  const daily=ym=>S.tx.filter(t=>t.type==='gasto'&&t.date.startsWith(ym)&&!t.repeat&&!t.from&&!t.bill&&t.cat!=='Deudas').reduce((a,t)=>a+t.amount,0);
  let tot=0,n=0;for(let i=1;i<=3;i++){const ym=ymAdd(-i),v=daily(ym);if(v>0){tot+=v;n++}}
  if(!n){const v=daily(nowYM);if(v>0){tot=v;n=1}}
  const avg=n?tot/n:0,month=r2(fixed+avg);
  return {saved,fixed,avg,month,t2:Math.max(EM1,month),step:saved>=EM1?(month>EM1&&saved<month?2:3):1};
}
function emergCard(){
  const e=emergInfo(),tgt=e.step===1?EM1:e.t2,pct=tgt>0?Math.min(100,e.saved/tgt*100):0;

  return `<section class="card bars span2" aria-labelledby="h-fe"><div class="card-h"><h2 id="h-fe">Fondo de emergencia</h2><button class="btn sm" type="button" data-act="emerg-add">${ic('plus')}Aportar</button></div>

  <div class="prow"><span>${e.step===1?'Escalón 1':e.step===2?'Escalón 2':'Fondo'}</span><span class="amt">${money(e.saved)} de ${money(tgt)}</span></div><div class="pbt" role="meter" aria-label="Avance del fondo de emergencia" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i style="width:${pct}%"></i></div>
  <ul class="list" style="margin-top:10px"><li class="kv"><span class="k">${e.saved>=EM1?'✓':'○'} Escalón 1</span><span class="v">${money(EM1)}</span></li><li class="kv"><span class="k">${e.step===3&&e.month>EM1?'✓':'○'} Escalón 2: 1 mes de gastos</span><span class="v">${e.month>0?money(e.month):'sin datos aún'}</span></li></ul>
  ${e.month>0?`<p class="note" style="margin-top:8px">El mes de gastos = gastos fijos y cuotas ${money(e.fixed)} + promedio de tus otros gastos de los últimos 3 meses ${money(e.avg)}.</p>`:''}</section>`;

const salPL=()=>S.clients.filter(c=>isSal(c)&&num(c.fee)>0&&c.status!=='Terminado');
function salDates(from,n){const set=new Set();salPL().forEach(c=>{const sm=streams(c).find(x=>x.k==='main');if(sm)dueDates(sm.o,from,addDays(from,75)).forEach(d=>set.add(d))});return [...set].sort().slice(0,n)}
function salNetOn(d,rd){let tot=0;salPL().forEach(c=>streams(c).forEach(sm=>{if((sm.k==='main'||sm.k==='comm')&&dueDates(sm.o,d,d).length)tot+=sm.feeAt?sm.feeAt(rd||d):sm.fee}));return tot}
function salNext(){
  const t=today(),ev=[];
  salPL().forEach(c=>(c.descs||[]).forEach(x=>{
    if(x.from&&x.from>t)ev.push({d:salDates(x.from,1)[0]||x.from,txt:`empieza el descuento de ${x.n||'planilla'}`});
    if(x.to&&x.to>=t){const nd=salDates(addDays(x.to,1),1)[0];if(nd)ev.push({d:nd,txt:`termina el descuento de ${x.n||'planilla'}`})}}));
  ev.sort((a,b)=>a.d.localeCompare(b.d));
  const now=salDates(t,2).map(d=>salNetOn(d,t));if(!now.length)return '';
  const e=ev[0],later=e?salDates(e.d,2).map(d=>salNetOn(d)):[];
  return `<section class="card span2" aria-labelledby="h-an"><p class="eyebrow" id="h-an">Lo que te llega</p><p><b>Ahora te llegan ${now.map(money).join(' y ')}.</b></p>${e&&later.length?`<p style="margin-top:6px">Desde el ${longDate(e.d)} te llegarán <b>${later.map(money).join(' y ')}</b> (${esc(e.txt)}).</p>`:''}</section>`;
}

const parseAmt=v=>{if(typeof v==='number')return v;let t=String(v||'').replace(/^[^\d-]*/,'').replace(/[^\d.,-]/g,'');if(t.includes(',')&&t.includes('.'))t=t.replace(/,/g,'');else t=t.replace(',','.');return parseFloat(t)||0};
async function pullInbox(){
  const dir=(SY.path||'data/state.json').replace(/[^/]+$/,'')+'inbox',br=SY.branch||'main';
  const r=await fetchT(ghUrl(dir)+'?ref='+encodeURIComponent(br),{headers:ghHead(),cache:'no-store'});
  if(r.status!==200)return;
  const L=await r.json();if(!Array.isArray(L))return;
  let n=0;
  for(const f of L.filter(x=>x&&x.type==='file'&&/^[\w.-]+\.json$/i.test(x.name)).slice(0,20)){
    const id='in-'+f.name.replace(/\.json$/i,'').replace(/[^\w-]/g,'').slice(0,50);
    if(!S.inbox.some(x=>x.id===id)&&!S.del[id]){
      const g=await fetchT(ghUrl(dir+'/'+f.name)+'?ref='+encodeURIComponent(br),{headers:ghHead(),cache:'no-store'});
      if(g.status===200){
        let j=null;try{j=JSON.parse(unb64((await g.json()).content))}catch(e){}
        if(j&&typeof j==='object'){
          const tp=/^ing/i.test(String(j.tipo??j.type??''))?'ingreso':'gasto',amount=parseAmt(j.monto??j.amount),desc=String(j.comercio??j.desc??'').slice(0,80),dt=String(j.fecha??j.date??''),catIn=String(j.categoria??j.cat??'').trim();
          if(/^s[ií]$/i.test(String(j.directo??''))&&amount>0&&amount<1e7){
            /* el Atajo ya eligió la categoría: se anota directo, sin pasar por «Por confirmar» */
            if(!S.tx.some(x=>x.id===id)){const t=cleanRec('tx',{id,type:tp,amount,cat:TXCATS[tp].includes(catIn)?catIn:(tp==='gasto'?'Otros':TXCATS.ingreso[0]),desc,date:isD(dt)?dt:today(),...(tp==='gasto'&&String(j.bolsillo??'')==='extra'?{src:'extra'}:{})});if(t){S.tx.unshift(t);n++}}
          }else{
            const rec=cleanRec('inbox',{id,type:tp,amount,desc,card:j.tarjeta??j.card,date:dt});
            if(rec){rec.cat=tp==='gasto'?(TXCATS.gasto.includes(catIn)?catIn:merchCat(rec.desc)):(TXCATS.ingreso.includes(catIn)?catIn:'');S.inbox.unshift(rec);n++}
          }
        }
      }
    }
    await fetchT(ghUrl(dir+'/'+f.name),{method:'DELETE',headers:ghHead(),body:JSON.stringify({message:'bandeja: leído',sha:f.sha,branch:br})}).catch(()=>{});
  }
  if(n){stamp();persist();autoSync();render()}
}

/* una meta se da por lograda sola cuando lo ahorrado alcanza el monto */
function checkGoals(){
  const out=[];
  S.goals.forEach(g=>{
    if(g.done||!(g.target>0))return;
    const tx=S.tx.filter(t=>t.type==='ahorro'&&t.cat===g.name).sort((a,b)=>a.date.localeCompare(b.date)),saved=tx.reduce((a,t)=>a+t.amount,0);
    if(saved<g.target-0.005)return;
    let acc=0,when_=tx.length?tx[tx.length-1].date:today();
    for(const t of tx){acc+=t.amount;if(acc>=g.target-0.005){when_=t.date;break}}
    g.done=true;g.doneOn=when_;g.final=saved;g.aportes=tx.length;g.since=g.created&&isD(g.created)?g.created:(tx[0]?tx[0].date:when_);
    out.push(g.id);
  });
  if(out.length){stamp();persist();autoSync()}
  return out;
}

function applyAutoPays(){
  let n=0;const t=today();
  S.clients.filter(c=>c.auto==='si'&&c.status!=='Terminado').forEach(c=>{
    const from=payStart(c);
    streams(c).forEach(sm=>{
      const dues=dueDates(sm.o,from,t).slice(-26),paid=paidMap(c,sm.k,dueDates(sm.o,addDays(from,-20),addDays(t,60)),from);
      dues.forEach(due=>{

function applyRecurring(){
  let n=0;const t0=today();
  S.tx.filter(t=>['mensual','quincenal','bimestral'].includes(t.repeat)&&isD(t.date)).forEach(t=>{
    const [y0,m0,d0]=t.date.split('-').map(Number);let cur=t.date;
    for(let k=1;k<=120;k++){
      let nx;
      if(t.repeat==='quincenal'){const [y,m,d]=cur.split('-').map(Number),ld=lastDay(y,m);nx=d<15?`${y}-${pad(m)}-15`:d<ld?`${y}-${pad(m)}-${pad(ld)}`:`${m===12?y+1:y}-${pad(m===12?1:m+1)}-15`}
      else{let m=m0+k*(t.repeat==='bimestral'?2:1),y=y0;while(m>12){m-=12;y++}nx=`${y}-${pad(m)}-${pad(Math.min(d0,lastDay(y,m)))}`}
      if(nx>t0)break;cur=nx;
      const id=`${t.id}-${t.repeat==='mensual'?nx.slice(0,7):nx.replace(/-/g,'')}`;
      if(id.length>64||S.tx.some(x=>x.id===id)||S.del[id])continue;
      const c={...t,id,date:nx,repeat:'',from:t.id};delete c.u;S.tx.push(c);n++;
    }
  });
  if(n){stamp();persist();autoSync()}
}

function quincenas(){

    out.push([`${y}-${pad(m)}-15`,`Quincena del 15 de ${MESES[m-1]}${sf}`],[`${y}-${pad(m)}-${pad(ld)}`,`Quincena de fin de mes (${ld} de ${MESES[m-1]}${sf})`]);
    m++;if(m>12){m=1;y++}}
  return out;
}

async function shrink(file,max=1080){
  return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(file);
    im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};
    im.onerror=()=>res(null);im.src=u});
}

/* ============ Imágenes (IndexedDB) ============ */
const IMG={};let idb=null;
const idbOpen=()=>new Promise(res=>{try{const r=indexedDB.open('miespacio',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
const idbDo=(mode,fn)=>new Promise(res=>{if(!idb)return res();try{const tx=idb.transaction('img',mode),rq=fn(tx.objectStore('img'));tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>res()}catch(e){res()}});
async function loadImgs(){
  idb=await idbOpen();if(!idb)return;
  await new Promise(res=>{const tx=idb.transaction('img'),rq=tx.objectStore('img').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){if(okImg(c.value))IMG[c.key]=c.value;c.continue()}};tx.oncomplete=res;tx.onerror=res});
}
const okImg=v=>typeof v==='string'&&v.length<8e6&&/^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(v);
const putImg=(id,v)=>{if(!okImg(v))return Promise.resolve();IMG[id]=v;return idbDo('readwrite',st=>st.put(v,id))};
const delImg=id=>{delete IMG[id];return idbDo('readwrite',st=>st.delete(id))};

/* ============ Sincronización con GitHub ============ */
const SYNC_KEY='miespacio.sync';
let SY={};try{SY=JSON.parse(localStorage.getItem(SYNC_KEY)||'{}')}catch(e){}
const saveSY=()=>{try{localStorage.setItem(SYNC_KEY,JSON.stringify(SY))}catch(e){}};
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const hs=t=>{let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return h};
let syncing=false,syT,syncStart=0,lastTry=0;
const fetchT=(u,o={},ms=25000)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(u,{...o,signal:c.signal}).finally(()=>clearTimeout(t))};
const autoSync=()=>{if(SY.repo&&SY.token){clearTimeout(syT);syT=setTimeout(()=>sync(false),3000)}};
const REPO_OK=/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/,PATH_OK=/^(?!.*\.\.)[A-Za-z0-9_.\/-]+$/;
const ghUrl=(p)=>{const path=p||SY.path||'data/state.json';if(!REPO_OK.test(SY.repo||'')||!PATH_OK.test(path))throw new Error('Repositorio o archivo con formato no válido');return `https://api.github.com/repos/${SY.repo}/contents/${path}`};
const ghHead=()=>({Authorization:'Bearer '+SY.token,Accept:'application/vnd.github+json'});
const imgPath=id=>(SY.path||'data/state.json').replace(/[^/]+$/,'')+`img/${id}.txt`;
function merge(R){
  R=cleanState(R);
  const del={...S.del};Object.entries(R.del||{}).forEach(([k,v])=>del[k]=Math.max(del[k]||0,v));
  COLL.forEach(c=>{
    const m=new Map(S[c].map(r=>[r.id,r]));
    (R[c]||[]).forEach(r=>{if(!r.id)return;r.u=r.u||Date.now();const l=m.get(r.id);if(!l||(l.u||0)<r.u)m.set(r.id,r)});
    S[c]=[...m.values()].filter(r=>!(del[r.id]>=(r.u||0)));
  });
  if((R.set.u||0)>(S.set.u||0))S.set={...S.set,...R.set,seeded:S.set.seeded};
  S.del=del;rebuildSnap();
}
async function syncImgs(){
  const br=SY.branch||'main',up=new Set(SY.up||[]),limit=Date.now()+40000;let n=0;
  for(const id of Object.keys(IMG)){
    if(up.has(id)||n>=6||Date.now()>limit)continue;
    const r=await fetchT(ghUrl(imgPath(id)),{method:'PUT',headers:ghHead(),body:JSON.stringify({message:'imagen',content:b64(IMG[id]),branch:br})});
    if(r.status===200||r.status===201||r.status===422){up.add(id);n++}else break;
  }
  SY.up=[...up];
  const need=[...new Set(S.posts.flatMap(p=>p.imgs||[]))].filter(id=>!IMG[id]).slice(0,6);
  for(const id of need){
    if(Date.now()>limit)break;
    const r=await fetchT(ghUrl(imgPath(id))+'?ref='+encodeURIComponent(br),{headers:ghHead(),cache:'no-store'});
    if(r.status===200){const j=await r.json();await putImg(id,atob(j.content.replace(/\n/g,'')))}
  }
  saveSY();
}
let imgBusy=false;
async function bgImgs(){
  if(imgBusy)return;imgBusy=true;
  try{const n=Object.keys(IMG).length;await syncImgs();if(Object.keys(IMG).length!==n)render()}catch(e){}finally{imgBusy=false}
}
let SYS=SY.token?(SY.err?'err':'ok'):'off';
async function sync(manual){
  if(!SY.repo||!SY.token){SYS='off';renderSync();if(manual)syncSheet();return}
  if(!navigator.onLine){SYS='offline';renderSync();if(manual)toast('Sin conexión: se sincroniza al volver');return}
  if(syncing&&Date.now()-syncStart<90000)return;
  syncing=true;syncStart=lastTry=Date.now();SYS='busy';renderSync();
  try{
    for(let tries=0;tries<2;tries++){
      const br=SY.branch||'main';let sha;
      const g=await fetchT(ghUrl()+'?ref='+encodeURIComponent(br),{headers:ghHead(),cache:'no-store'});
      if(g.status===200){const j=await g.json();sha=j.sha;merge(JSON.parse(unb64(j.content)))}
      else if(g.status!==404)throw new Error(g.status===401?'El token no es válido o venció':g.status===403?'GitHub negó el acceso o hay demasiadas consultas':`GitHub respondió ${g.status}`);
      stamp();persist();
      const body=JSON.stringify({v:2,events:S.events,tx:S.tx,shop:S.shop,clients:S.clients,tasks:S.tasks,ideas:S.ideas,posts:S.posts,goals:S.goals,debts:S.debts,bills:S.bills,inbox:S.inbox,set:{name:S.set.name,budget:S.set.budget,gross:S.set.gross,alertPct:S.set.alertPct,leadDays:S.set.leadDays,caps:S.set.caps,balS:S.set.balS,balSd:S.set.balSd,balE:S.set.balE,balEd:S.set.balEd,u:S.set.u},del:S.del},null,1);
      const h=hs(body);
      if(sha&&SY.sha===sha&&SY.h===h){SY.err='';break}
      const pr=await fetchT(ghUrl(),{method:'PUT',headers:ghHead(),body:JSON.stringify({message:'sync: datos de Todo en Orden',content:b64(body),branch:br,...(sha?{sha}:{})})});
      if(pr.status===200||pr.status===201){const j=await pr.json();SY.sha=j.content.sha;SY.h=h;SY.err='';break}
      if((pr.status===409||pr.status===422)&&tries===0)continue;
      throw new Error(pr.status===404?'No encuentro el repositorio o la rama':pr.status===403?'El token no tiene permiso de escritura':`No se pudo guardar (${pr.status})`);
    }
    SY.last=new Date().toISOString();SY.err='';saveSY();SYS='ok';render();if(manual)toast('Sincronizado');
    pullInbox().catch(()=>{});bgImgs();
  }catch(e){SY.err=e&&e.name==='AbortError'?'La conexión tardó demasiado. Toca para reintentar.':String(e.message||e);saveSY();SYS='err';renderSync();if(manual)toast(SY.err)}
  finally{syncing=false;if(SYS==='busy'){SYS='err';renderSync()}}
}
const ago=iso=>{if(!iso)return '';const m=Math.round((Date.now()-new Date(iso))/60000);return m<1?'ahora':m<60?`hace ${m} min`:m<1440?`hace ${Math.round(m/60)} h`:`hace ${Math.round(m/1440)} d`};
function renderSync(){
  const txt={off:'Sin sincronizar',ok:`Sincronizado ${ago(SY.last)}`,busy:'Sincronizando…',err:'No se pudo sincronizar',offline:'Sin conexión'}[SYS];
  document.querySelectorAll('.syncbtn').forEach(b=>{b.dataset.s=SYS;b.innerHTML=`${ic('refresh')}<span>${txt}</span>`;b.title=SYS==='err'?(SY.err||''):'';b.setAttribute('aria-label',txt+(SYS==='err'?': '+(SY.err||''):'')+'. Tocar para sincronizar')});
}
function syncSheet(){
  const st=SY.err?`Problema: ${esc(SY.err)}`:SY.last?`Última sincronización ${ago(SY.last)}.`:'Aún sin sincronizar.';

    pre:`<p class="note" style="margin-bottom:14px">Guarda tus datos en tu repositorio privado de GitHub para verlos igual en el celular y la computadora. Necesitas un token de GitHub (Fine-grained, solo ese repositorio, permiso Contents en Read and write). Se guarda solo en este aparato. ${st}</p>`,
    fields:[{k:'repo',l:'Repositorio',ph:'usuario/repositorio'},{k:'branch',l:'Rama',ph:'main'},{k:'token',l:'Token de GitHub',t:'password',ph:'github_pat_…'},{k:'path',l:'Archivo de datos',ph:'data/state.json'}],
    onSave:v=>{SY={...SY,...v};if(!SY.branch)SY.branch='main';if(!SY.path)SY.path='data/state.json';SY.sha='';saveSY();
      if(!SY.repo||!SY.token){SYS='off';toast('Falta el token de GitHub: sin él no se puede sincronizar');renderSync();return false}
      SYS='busy';setTimeout(()=>sync(true),50)}});
}

/* ============ PIN de la app (pantalla de privacidad de este aparato) ============ */
const PIN_KEY='miespacio.pin';
const pinRec=()=>{try{return JSON.parse(localStorage.getItem(PIN_KEY)||'null')}catch(e){return null}};
async function hashPin(pin,salt){
  const d=new TextEncoder().encode(salt+':'+pin);
  if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',d);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  let h=0;for(const b of d)h=(h*31+b)|0;return String(h);
}
async function setPin(pin){const salt=uid()+uid();localStorage.setItem(PIN_KEY,JSON.stringify({s:salt,h:await hashPin(pin,salt),n:pin.length}))}
function pinSheet(){
  const has=!!pinRec();
  sheet({title:'PIN de la app',data:{},
    pre:`<p class="note" style="margin-bottom:14px">${has?'Ya tienes un PIN. Escribe uno nuevo para cambiarlo, o deja los dos campos vacíos y guarda para quitarlo.':'Pide un PIN de 4 a 6 números al abrir la app. Es una pantalla de privacidad para este aparato; no cifra tus datos.'}</p>`,
    fields:[{k:'pin',l:'PIN nuevo',t:'password'},{k:'pin2',l:'Repite el PIN',t:'password'}],
    setup(f){['pin','pin2'].forEach(k=>{const e=f.elements[k];e.setAttribute('inputmode','numeric');e.setAttribute('maxlength','6');e.setAttribute('autocomplete','new-password')})},
    onSave:v=>{
      if(!v.pin&&!v.pin2){if(has){localStorage.removeItem(PIN_KEY);toast('PIN quitado')}return}
      if(!/^\d{4,6}$/.test(v.pin)){toast('El PIN debe tener de 4 a 6 números');return false}
      if(v.pin!==v.pin2){toast('Los dos PIN no coinciden');return false}
      setPin(v.pin).then(()=>toast('PIN guardado'));
    }});
}
let lockBuf='',lockFail=0,lockUntil=0,hiddenAt=0,lockBusy=false;
function paintLock(msg){
  const r=pinRec(),n=r?r.n:4;
  $('#lockDots').innerHTML=Array.from({length:n},(_,i)=>`<i class="${i<lockBuf.length?'on':''}"></i>`).join('');
  if(msg!==undefined)$('#lockMsg').textContent=msg;
}
function showLock(){
  if(!pinRec())return;
  lockBuf='';paintLock('Escribe tu PIN');$('#lock').hidden=false;
  document.querySelectorAll('body>*:not(#lock):not(svg):not(script)').forEach(e=>{e.inert=true});
}
function hideLock(){$('#lock').hidden=true;document.querySelectorAll('body>*').forEach(e=>{e.inert=false})}
async function lockKey(k){
  const r=pinRec();if(!r||lockBusy)return;
  if(Date.now()<lockUntil){paintLock('Espera unos segundos e intenta de nuevo');return}
  if(k==='del'){lockBuf=lockBuf.slice(0,-1);paintLock('Escribe tu PIN');return}
  if(lockBuf.length>=r.n)return;
  lockBuf+=k;paintLock();
  if(lockBuf.length===r.n){
    lockBusy=true;const ok=(await hashPin(lockBuf,r.s))===r.h;lockBusy=false;
    if(ok){lockFail=0;hideLock();return}
    lockBuf='';lockFail++;
    if(lockFail>=5){lockUntil=Date.now()+30000;lockFail=0;paintLock('Demasiados intentos. Espera 30 segundos')}
    else paintLock('PIN incorrecto');
  }
}
$('#keypad').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)lockKey(b.dataset.k)});
document.addEventListener('keydown',e=>{
  if($('#lock').hidden)return;
  if(/^\d$/.test(e.key))lockKey(e.key);else if(e.key==='Backspace')lockKey('del');
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(pinRec()&&$('#lock').hidden&&hiddenAt&&Date.now()-hiddenAt>60000)showLock();
});

    case 'budget':amountSheet('Tope de gasto del mes (solo para avisarte)',S.set.budget,n=>{S.set={...S.set,budget:n,u:Date.now()}});break;
    case 'shop-toggle':{const s=S.shop.find(x=>x.id===id);s.done=!s.done;save();render();break}
    case 'edit-shop':shopSheet(id);break;
    case 'shop-fav':{const f=S.favs.find(x=>x.name===el.dataset.n);S.shop.unshift({id:uid(),name:f.name,cat:f.cat,qty:'',done:false});save();render();break}
    case 'shop-clear':{
      const done=S.shop.filter(s=>s.done);if(!done.length){toast('No hay productos marcados');break}
      done.forEach(s=>{if(!S.favs.some(f=>f.name.toLowerCase()===s.name.toLowerCase()))S.favs.unshift({name:s.name,cat:s.cat})});
      S.favs=S.favs.slice(0,40);S.shop=S.shop.filter(s=>!s.done);save();render();toast('Lista limpia');break}
    case 'shop-expense':
      amountSheet('¿Cuánto gastaste en el súper?','',n=>{if(!n)return false;
        S.tx.unshift({id:uid(),type:'gasto',amount:n,cat:'Super',desc:'Compra del súper',date:today()});toast('Gasto registrado')});break;
    case 'open-client':nav({open:id,proj:id});break;
    case 'go-client':closeSheet();nav({tab:'work',sub:'clients',pubcal:false,open:id,proj:id});break;
    case 'pay-client':cobroSheet(id,null,el.dataset.for||'');break;
    case 'add-goal':goalSheet();break;
    case 'fper':ui.fper=id;render();break;
    case 'salary':salarySheet();break;
    case 'add-fixed':txSheet(null,'gasto');break;
    case 'edit-goal':goalSheet(id);break;
    case 'no-goal':closeSheet();toast('Listo. Tu alcancía queda lista para cuando quieras otra meta');render();break;
    case 'open-cuenta':closeSheet();nav({tab:'money',sub:'cuenta'});break;
    case 'open-pay':closeSheet();nav({tab:'money',sub:'pay'});break;
    case 'bill-check':billCheckSheet(id,el.dataset.d);break;
    case 'add-bill':billSheet();break;
    case 'edit-bill':billSheet(id);break;
    case 'pm-prev':ui.pm=shiftM(ui.pm,-1);render();break;
    case 'pm-next':ui.pm=shiftM(ui.pm,1);render();break;
    case 'emerg-add':sheet({title:'Aportar al fondo de emergencia',required:'amount',data:{src:lastSrc()},fields:[{k:'amount',l:'Monto',t:'number',ph:'0.00'},{k:'src',l:'¿De dónde sale?',t:'pick',o:SRCS}],onSave:v=>{if(!(v.amount>0)){toast('Pon el monto');return false}S.tx.unshift({id:uid(),type:'ahorro',amount:v.amount,cat:'Emergencia',desc:'Aporte al fondo de emergencia',date:today(),...(v.src==='extra'?{src:'extra'}:{})});rememberSrc(v.src);toast('Aporte registrado')}});break;
    case 'extra-send':extraSheet();break;
    case 'cap':capSheet(id||'');break;
    case 'open-mov':closeSheet();ui.month=nowYM;nav({tab:'money',sub:'mov'});break;
    case 'add-desc':descSheet(id);break;
    case 'edit-desc':descSheet(el.dataset.cid,id);break;
    case 'open-debt':nav({sub:'debt',debt:id,dq:'',tab:'money'});break;
    case 'abono-debt':abonoSheet(id);break;
    case 'adj-debt':adjSheet(id);break;
    case 'plan-debt':debtPaySheet(id,'plan');break;
    case 'add-debt':debtSheet();break;
    case 'edit-debt':debtSheet(id);break;
    case 'pay-debt':debtPaySheet(id,el.dataset.k);break;
    case 'edit-dpay':debtPaySheet(id,'',el.dataset.pid);break;
    case 'open-debts':closeSheet();nav({tab:'money',sub:'debts'});break;
    case 'goal-add':{const g=S.goals.find(x=>x.id===id);if(!g)break;
      amountSheet(`Aporte a ${g.name}`,'',n=>{if(!n)return false;S.tx.unshift({id:uid(),type:'ahorro',amount:n,cat:g.name,desc:`Aporte a ${g.name}`,date:today()});toast('Aporte registrado')});break}
    case 'search':openSearch();break;
    case 'pin-forgot':pinForgot();break;
    case 'del-client':delClientSheet(id);break;
    case 'add-client':clientSheet();break;
    case 'edit-client':clientSheet(id);break;
    case 'add-post':postSheet(null,el.dataset.date||'');break;
    case 'open-pubcal':nav({pubcal:true});break;
    case 'pc-prev':ui.pcal=shiftM(ui.pcal,-1);render();break;
    case 'pc-next':ui.pcal=shiftM(ui.pcal,1);render();break;
    case 'pc-day':ui.psel=id;render();break;
    case 'edit-post':postSheet(id);break;
    case 'adv':{const x=S.posts.find(x=>x.id===id);x.status=NEXT[x.status];save();render();toast(`Ahora está en «${x.status}»`);break}
    case 'add-idea':ideaSheet(null,id||'');break;
    case 'edit-idea':ideaSheet(id);break;
    case 'star':{const i=S.ideas.find(x=>x.id===id);i.fav=!i.fav;save();render();break}
  }
});
document.addEventListener('submit',e=>{
  if(e.target.dataset&&e.target.dataset.quick==='task'){
    e.preventDefault();const n=e.target.n.value.trim();if(!n||!ui.open)return;
    S.tasks.unshift({id:uid(),title:n,project:ui.open,due:'',done:false});save();render();const i=$('#qt');i&&i.focus();return}
  if(e.target.id!=='shopForm')return;
  e.preventDefault();
  const n=e.target.n.value.trim();if(!n)return;
  S.shop.unshift({id:uid(),name:n,cat:e.target.c.value,qty:'',done:false});save();render();
  const i=$('#shopName');i&&i.focus();
});

render();showLock();
loadImgs().then(()=>{render();notifyOnce()});
sync(false);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastTry>10*60000)sync(false)});
addEventListener('online',()=>{if(SYS==='offline'||SYS==='err'||Date.now()-lastTry>10*60000)sync(false)});
addEventListener('offline',()=>{SYS='offline';renderSync()});
/* sincronización automática: cada hora, cada 4 horas o solo al abrir y al guardar (se elige en Ajustes) */
setInterval(()=>{renderSync();const m=SY.every===undefined?60:+SY.every;if(m>0&&!document.hidden&&SY.token&&Date.now()-lastTry>=m*60000)sync(false)},60000);
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    r.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})});
  }).catch(()=>{}));
}
async function hardRefresh(){
  try{const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}
  location.replace(location.pathname+'?v='+Date.now());
}
</script>
