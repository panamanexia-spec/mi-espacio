<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#fff0f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Espacio">
<title>Mi Espacio</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff5f8; --card:#ffffff; --ink:#4a2c3f; --muted:#9a7f90; --line:#f6dce6;
  --rose:#ec6c97; --rose2:#f9a8c4; --lilac:#a98bf0; --peach:#ffb89e; --mint:#5fcfa8; --sky:#7cc4f5;
  --grad:linear-gradient(135deg,#f58bb0,#b393f2);
  --shadow:0 10px 30px -12px rgba(214,90,140,.35);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Quicksand',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));font-size:15px;line-height:1.4}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.55}
body::before{width:300px;height:300px;background:#ffd1e1;top:-80px;right:-80px}
body::after{width:280px;height:280px;background:#e3d6ff;bottom:60px;left:-100px}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
main{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.top h1{font-size:28px;line-height:1.1}
.top small{display:block;color:var(--muted);font-weight:600;text-transform:capitalize;margin-bottom:2px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid #fff}
.card h3{font-size:18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.card h3 a,.link{font-family:'Quicksand';font-size:13px;color:var(--rose);font-weight:700;cursor:pointer}
.hero{background:var(--grad);color:#fff;border:0}
.hero h3{color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff7fa;border-radius:16px;padding:12px;border:1px solid var(--line)}
.hero .stat{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3)}
.stat span{display:block;font-size:12px;font-weight:700;opacity:.8;text-transform:uppercase;letter-spacing:.04em}
.stat b{font-size:20px;font-family:'Playfair Display',serif}
.pos{color:#2fae83}.neg{color:#e5547f}
.hero .pos,.hero .neg{color:#fff}
.btn{background:var(--grad);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;box-shadow:0 8px 18px -8px rgba(214,90,140,.7)}
.btn.ghost{background:#fff;color:var(--rose);box-shadow:none;border:1.5px solid var(--rose2)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.danger{background:#fff;color:#d63c6b;border:1.5px solid #f8b4c8;box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:13px;color:var(--muted)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff;vertical-align:middle}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0;cursor:pointer}
.item .t{font-weight:700;overflow-wrap:anywhere}
.item .s{font-size:12.5px;color:var(--muted)}
.item.done .t{text-decoration:line-through;opacity:.45}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--rose2);flex:none;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}
.item.done .check{background:var(--grad);border-color:transparent}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-weight:600}
.empty i{display:block;font-size:30px;font-style:normal;margin-bottom:4px}
.amt{font-weight:700;white-space:nowrap}
.ico{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;background:#fff0f5;font-size:19px;flex:none}
.bar{height:9px;border-radius:9px;background:#fbe8ef;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--grad)}
.brow{margin-bottom:11px;font-weight:600;font-size:14px}
.brow div:first-child{display:flex;justify-content:space-between}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(94vw,520px);
  background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:28px;padding:7px;display:flex;
  box-shadow:0 12px 36px -10px rgba(190,80,130,.45);border:1px solid #fff;z-index:20}
.nav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0;border-radius:18px;font-size:9.5px;font-weight:700;color:var(--muted)}
.nav button span{font-size:19px;line-height:1.1}
.nav button.on{background:var(--grad);color:#fff}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);padding-bottom:4px}
.day{aspect-ratio:1/1.05;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:14px;background:#fff7fa}
.day.out{visibility:hidden}
.day.today{border:2px solid var(--rose)}
.day.sel{background:var(--grad);color:#fff}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.day.sel .dots i{background:#fff!important}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{font-family:'Playfair Display',serif;font-size:20px;text-transform:capitalize}
.mnav button{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:18px;color:var(--rose);font-weight:700}
/* ideas */
.ideas{columns:2;column-gap:12px}
.idea{break-inside:avoid;border-radius:20px;padding:14px;margin-bottom:12px;cursor:pointer;box-shadow:var(--shadow);position:relative}
.idea h4{margin:0 24px 4px 0;font-size:15px}
.idea p{margin:0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;opacity:.85}
.idea .star{position:absolute;top:8px;right:8px;font-size:18px;padding:4px}
.idea small{display:block;margin-top:8px;font-weight:700;font-size:11px;opacity:.65}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
#sheet .back{position:absolute;inset:0;background:rgba(74,44,63,.4);backdrop-filter:blur(3px)}
#sheet .panel{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,560px);max-height:92vh;overflow:auto;background:#fff;
  border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.panel h3{margin-bottom:12px;font-size:22px}
.f{display:block;margin-bottom:12px}
.f span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 4px 4px;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;font:inherit;color:var(--ink);padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:#fff9fb;outline:0;appearance:none;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--rose2);background:#fff}
input[type=date],input[type=time]{min-height:46px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btns .btn{flex:1;min-width:110px}
.quick{display:flex;gap:8px;margin-bottom:12px}
.quick input{flex:1}
.seg{display:flex;background:#fff;border-radius:999px;padding:4px;box-shadow:var(--shadow);margin-bottom:14px}
.seg button{flex:1;padding:10px;border-radius:999px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--grad);color:#fff}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.gh{font-size:12px;font-weight:700;color:var(--rose);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 2px}
details summary{cursor:pointer;font-weight:700;color:var(--rose);list-style:none}
details summary::-webkit-details-marker{display:none}
.mrow{display:grid;grid-template-columns:70px 1fr 1fr 1fr;gap:6px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;font-weight:600;text-align:right}
.mrow:first-child{color:var(--muted);font-size:11px;text-transform:uppercase}
.mrow>:first-child{text-align:left;text-transform:capitalize}
/* feed */
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 8px}
.strip .th{position:relative;flex:none;width:76px;height:96px;border-radius:12px;background:center/cover;border:2px solid transparent;cursor:pointer}
.strip .th.cv{border-color:var(--rose)}
.strip .th button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px}
.thumb{width:56px;height:70px;border-radius:12px;background:var(--grad) center/cover;flex:none}
.badge{position:absolute;top:1px;right:14%;min-width:16px;height:16px;border-radius:9px;background:#ef5b5b;color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.al{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px dashed var(--line);cursor:pointer;font-weight:600;font-size:14px}
.al:last-child{border:0}
.al.l2 b,.al.l3 b{color:#e5547f}
.note{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 10px}
</style>
</head>
<body>
<main id="app"></main>
<nav class="nav" id="nav"></nav>
<div id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="application/json" hidden>

<script>
/* ============ Datos ============ */
const KEY='miespacio.v1';
const DEF={events:[],tx:[],shop:[],clients:[],tasks:[],ideas:[],posts:[],favs:[],del:{},set:{name:'',budget:0}};
const COLL=['events','tx','shop','clients','tasks','ideas','posts'];
let S;
try{S=Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=structuredClone(DEF)}
S.set=Object.assign({name:'',budget:0},S.set);
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar 😢')}};
/* cada registro lleva "u" (última modificación) para poder sincronizar sin pisar cambios */
let snap={};
const rj=r=>JSON.stringify({...r,u:0});
function rebuildSnap(){snap={};COLL.forEach(c=>S[c].forEach(r=>{if(!r.u)r.u=Date.now();snap[r.id]=rj(r)}))}
function stamp(){
  const ids=new Set();
  COLL.forEach(c=>S[c].forEach(r=>{ids.add(r.id);const j=rj(r);if(snap[r.id]!==j){r.u=Date.now();snap[r.id]=j}}));
  Object.keys(snap).forEach(id=>{if(!ids.has(id)){S.del[id]=Date.now();delete snap[id]}});
}
const save=()=>{stamp();persist();autoSync()};
rebuildSnap();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ============ Constantes ============ */
const PROJ=['Nexia','Identidad Prestada'];
const COL={'Personal':'#f472b6','Nexia':'#a98bf0','Identidad Prestada':'#fb7185','Finanzas':'#5fcfa8','Salud':'#7cc4f5','Casa':'#ffb27a','Otros':'#c3a9bf'};
const ECATS=Object.keys(COL);
const IDEA_PROJ=['Nexia','Identidad Prestada','Personal'];
const IDEA_BG={'Nexia':'#efe7ff','Identidad Prestada':'#ffe3ea','Personal':'#fff0d9'};
const TXCATS={ingreso:['Nexia','Identidad Prestada','Otros ingresos'],
  gasto:['Casa','Super','Transporte','Salud','Ocio','Servicios','Belleza y ropa','Trabajo','Otros'],
  ahorro:['Ahorro','Emergencia','Metas']};
const CATICO={Nexia:'💜','Identidad Prestada':'🌹','Otros ingresos':'✨',Casa:'🏡',Super:'🛒',Transporte:'🚌',Salud:'🌿',Ocio:'🎬',Servicios:'💡','Belleza y ropa':'💄',Trabajo:'💼',Otros:'🎀',Ahorro:'🐷',Emergencia:'🛟',Metas:'🎯'};
const SHOPCATS=['Frutas y verduras','Carnes y pescado','Lácteos y huevos','Despensa','Limpieza','Higiene y belleza','Otros'];
const STATUS=['Prospecto','Activo','En pausa','Terminado'];
const SCOL={Prospecto:'#ffb27a',Activo:'#5fcfa8','En pausa':'#c3a9bf',Terminado:'#a98bf0'};
const PST=['Pendiente','En revisión','Aprobado','Por subir','Por cambiar','Publicado'];
const PCOL={Pendiente:'#ffb27a','En revisión':'#7cc4f5',Aprobado:'#5fcfa8','Por subir':'#ec6c97','Por cambiar':'#ef5b5b',Publicado:'#a98bf0'};
const NEXT={Pendiente:'En revisión','En revisión':'Aprobado',Aprobado:'Por subir','Por subir':'Publicado','Por cambiar':'En revisión'};
const FMT=['Post','Carrusel','Reel','Story'];
const FICO={Post:'',Carrusel:'🗂️',Reel:'🎬',Story:'⭕'};
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ============ Utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const D=s=>new Date(s+'T00:00');
const addDays=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return ymd(d)};
const money=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('es-PA',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>parseFloat(String(v).replace(',','.'))||0;
const mLabel=ym=>`${MESES[+ym.slice(5)-1]} ${ym.slice(0,4)}`;
const shiftM=(ym,n)=>{const d=new Date(+ym.slice(0,4),+ym.slice(5)-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const longDate=s=>D(s).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}
const tag=(txt,c)=>`<span class="tag" style="background:${c}">${esc(txt)}</span>`;
const empty=(i,t)=>`<div class="empty"><i>${i}</i>${t}</div>`;

/* ============ Estado de UI ============ */
const nowYM=today().slice(0,7);
const ui={tab:'home',cal:nowYM,sel:today(),month:nowYM,proj:'Nexia',ideaF:'Todas',fclient:'',fstatus:'Todos'};

/* ============ Lógica ============ */
function occurs(ev,d){
  if(ev.date===d)return true;
  if(!ev.repeat||ev.repeat==='ninguna'||d<ev.date)return false;
  const a=D(ev.date),b=D(d);
  if(ev.repeat==='diaria')return true;
  if(ev.repeat==='semanal')return Math.round((b-a)/864e5)%7===0;
  if(ev.repeat==='mensual')return a.getDate()===b.getDate();
  if(ev.repeat==='anual')return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth();
  return false;
}
function itemsOn(d){
  const L=[];
  S.events.filter(e=>occurs(e,d)).forEach(e=>L.push({kind:'ev',id:e.id,title:e.title,time:e.time||'',cat:e.cat,done:!!(e.doneOn&&e.doneOn[d]),d,rep:e.repeat&&e.repeat!=='ninguna'}));
  S.tasks.filter(t=>t.due===d).forEach(t=>{const c=S.clients.find(c=>c.id===t.clientId);L.push({kind:'task',id:t.id,title:t.title,time:'',cat:t.project,done:t.done,d,sub:c?c.name:''})});
  S.posts.filter(p=>p.date===d).forEach(p=>{const c=S.clients.find(c=>c.id===p.clientId);L.push({kind:'post',id:p.id,title:'📸 '+p.title,time:p.time||'',cat:p.project,done:p.status==='Publicado',d,sub:`${c?c.name+' · ':''}${p.status}`})});
  return L.sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
}
const totals=ym=>{const r={ingreso:0,gasto:0,ahorro:0};S.tx.filter(t=>t.date.startsWith(ym)).forEach(t=>r[t.type]+=t.amount);r.libre=r.ingreso-r.gasto-r.ahorro;return r};
const editAct=k=>k==='ev'?'edit-ev':k==='post'?'edit-post':'edit-task';
function itemRow(i){
  const c=COL[i.cat]||COL.Otros;
  return `<div class="item ${i.done?'done':''}"><button class="check" data-act="toggle" data-kind="${i.kind}" data-id="${i.id}" data-d="${i.d}">${i.done?'✓':''}</button>
  <div class="grow" data-act="${editAct(i.kind)}" data-id="${i.id}"><div class="t">${esc(i.title)}</div>
  <div class="s">${i.time?'🕐 '+i.time+' · ':''}${i.rep?'🔁 ':''}${i.kind==='task'?'📌 ':''}${esc(i.sub||'')}</div></div>${tag(i.cat,c)}</div>`;
}
function alerts(){
  const t=today(),A=[],cn=id=>{const c=S.clients.find(c=>c.id===id);return c?' · '+c.name:''};
  S.posts.forEach(p=>{
    const w=`${p.title}${cn(p.clientId)}`;
    if(p.status==='Por subir')A.push({lvl:2,ic:'📲',tx:`Por subir: ${w}`,act:'edit-post',id:p.id});
    else if(p.status==='Por cambiar')A.push({lvl:2,ic:'✏️',tx:`Por cambiar: ${w}`,act:'edit-post',id:p.id});
    else if(p.status!=='Publicado'&&p.date&&p.date<=addDays(t,2))A.push({lvl:p.date<t?3:1,ic:'⏰',tx:`${p.date<t?'Atrasado':p.date===t?'Hoy':'Pronto'}: ${w} (${p.status})`,act:'edit-post',id:p.id});
  });
  const rev=S.posts.filter(p=>p.status==='En revisión').length;
  if(rev)A.push({lvl:0,ic:'👀',tx:`${rev} publicación${rev>1?'es':''} en revisión del cliente`,act:'tab',id:'feed'});
  S.tasks.filter(x=>!x.done&&x.due&&x.due<=t).forEach(x=>A.push({lvl:x.due<t?3:1,ic:'📌',tx:`${x.due<t?'Tarea vencida':'Tarea de hoy'}: ${x.title}`,act:'edit-task',id:x.id}));
  return A.sort((a,b)=>b.lvl-a.lvl);
}
function notifyOnce(){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted'||localStorage.getItem('miespacio.notif')===today())return;
    const A=alerts().filter(a=>a.lvl>=1);if(!A.length)return;
    localStorage.setItem('miespacio.notif',today());
    navigator.serviceWorker.ready.then(r=>r.showNotification('Mi Espacio 🌸',{body:A.slice(0,4).map(a=>a.ic+' '+a.tx).join('\n'),icon:'icon-192.png'}));
  }catch(e){}
}
const header=(small,title,btn)=>`<div class="top"><div><small>${small}</small><h1>${title}</h1></div>${btn||''}</div>`;

/* ============ Vistas ============ */
function alertCard(){
  const A=alerts();if(!A.length)return '';
  return `<div class="card"><h3>🔔 Alertas</h3>${A.slice(0,6).map(a=>`<div class="al l${a.lvl}" data-act="${a.act}" data-id="${a.id}"><span class="ico">${a.ic}</span><b style="font-weight:600">${esc(a.tx)}</b></div>`).join('')}${A.length>6?`<div class="note" style="margin:8px 0 0">+${A.length-6} más…</div>`:''}</div>`;
}
function vHome(){
  const t=today(),h=new Date().getHours();
  const hi=h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches';
  const name=S.set.name?`, ${esc(S.set.name)}`:'';
  const items=itemsOn(t);
  const up=[];for(let i=1;i<=7;i++){const d=addDays(t,i);itemsOn(d).forEach(x=>up.push(x))}
  const tt=totals(nowYM);
  const pend=S.shop.filter(s=>!s.done).length;
  const tp=p=>S.tasks.filter(x=>x.project===p&&!x.done).length;

let onCancel=null;
function closeSheet(){if(onCancel){onCancel();onCancel=null}$('#sheet').classList.remove('open');$('#sheet').innerHTML=''}
function sheet(o){
  const d=o.data||{};
  const fields=o.fields.map(x=>{
    const v=d[x.k]??x.def??'';let inp;
    if(x.t==='select')inp=`<select name="${x.k}">${x.o.map(op=>{const [val,lab]=Array.isArray(op)?op:[op,op];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
    else if(x.t==='textarea')inp=`<textarea name="${x.k}" rows="3" placeholder="${esc(x.ph||'')}">${esc(v)}</textarea>`;
    else inp=`<input name="${x.k}" type="${x.t==='number'?'text':(x.t||'text')}" ${x.t==='number'?'inputmode="decimal"':''} value="${esc(v)}" placeholder="${esc(x.ph||'')}" autocomplete="off">`;
    return `<label class="f"><span>${x.l}</span>${inp}</label>`;
  }).join('');
  const el=$('#sheet');
  el.innerHTML=`<div class="back" data-act="close"></div><form class="panel"><div class="grab"></div><h3>${o.title}</h3>${o.pre||''}${fields}
   <div class="btns"><button class="btn" type="submit">Guardar</button><button class="btn ghost" type="button" data-act="close">Cancelar</button>
   ${(o.extra||[]).map((e,i)=>`<button class="btn ghost" type="button" data-x="${i}">${e.label}</button>`).join('')}
   ${o.onDelete?`<button class="btn danger" type="button" data-del="1">Eliminar</button>`:''}</div></form>`;
  el.classList.add('open');
  onCancel=o.onCancel||null;
  const form=el.querySelector('form');
  form.onsubmit=e=>{
    e.preventDefault();
    const v={};o.fields.forEach(x=>{let val=form.elements[x.k].value.trim();if(x.t==='number')val=num(val);v[x.k]=val});
    if(o.required&&!v[o.required]){toast('Falta completar ✏️');return}
    if(o.onSave(v)===false)return;
    onCancel=null;save();closeSheet();render();
  };
  form.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>o.extra[b.dataset.x].fn(form));
  const del=form.querySelector('[data-del]');
  if(del)del.onclick=()=>{
    if(!del.dataset.sure){del.dataset.sure=1;del.textContent='¿Seguro? Toca otra vez';return}
    o.onDelete();onCancel=null;save();closeSheet();render()};
  if(o.setup)o.setup(form);
}
const upsert=(arr,item)=>{const i=arr.findIndex(x=>x.id===item.id);i>=0?arr[i]={...arr[i],...item}:arr.unshift(item)};
const remove=(arr,id)=>{const i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1)};

    onDelete:t?()=>remove(S.tx,t.id):null});

const clientOpts=()=>[['','— Sin cliente —'],...S.clients.map(c=>[c.id,`${c.name} · ${c.project}`])];
async function shrink(file,max=1080){
  return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(file);
    im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};
    im.onerror=()=>res(null);im.src=u});
}
function postSheet(id){
  const p=S.posts.find(x=>x.id===id);
  let imgs=[...(p?p.imgs||[]:[])],added=[];
  const draw=()=>{const st=$('#strip');if(st)st.innerHTML=imgs.map((i,n)=>`<div class="th ${n?'':'cv'}" data-cover="${i}" style="background-image:url('${IMG[i]||''}')"><button type="button" data-rm="${i}">✕</button></div>`).join('')||'<div class="note">Sin imágenes todavía</div>'};
  sheet({title:p?'Editar publicación':'Nueva publicación',required:'title',
    data:p||{project:ui.proj,clientId:ui.fclient||'',format:'Post',status:'Pendiente',date:today()},
    pre:`<div class="strip" id="strip"></div><p class="note" style="margin:0 0 6px 4px">Toca una imagen para dejarla de portada.</p><label class="btn ghost sm" style="display:inline-block;margin-bottom:14px">📷 Agregar imágenes<input type="file" id="pimg" accept="image/*" multiple hidden></label>`,
    fields:[{k:'title',l:'Título interno',ph:'Ej. Reel lanzamiento'},{k:'status',l:'Estado',t:'select',o:PST},{k:'project',l:'Proyecto',t:'select',o:PROJ},{k:'clientId',l:'Cliente',t:'select',o:clientOpts()},
      {k:'format',l:'Formato',t:'select',o:FMT},{k:'date',l:'Fecha de publicación',t:'date'},{k:'time',l:'Hora',t:'time'},
      {k:'caption',l:'Copy / caption',t:'textarea'},{k:'tags',l:'Hashtags',ph:'#marketing #marca'},{k:'feedback',l:'Cambios pedidos / comentarios del cliente',t:'textarea'},{k:'link',l:'Link (Drive, Canva…)',ph:'https://'}],
    setup(){
      draw();
      $('#pimg').onchange=async e=>{for(const f of e.target.files){const d=await shrink(f);if(d){const iid=uid();await putImg(iid,d);imgs.push(iid);added.push(iid)}}e.target.value='';draw()};
      $('#strip').onclick=e=>{const rm=e.target.closest('[data-rm]');
        if(rm){imgs=imgs.filter(x=>x!==rm.dataset.rm)}
        else{const c=e.target.closest('[data-cover]');if(c){const i=c.dataset.cover;imgs=[i,...imgs.filter(x=>x!==i)]}}
        draw()};
    },
    onCancel:()=>added.forEach(delImg),
    onSave:v=>{(p?p.imgs||[]:[]).filter(i=>!imgs.includes(i)).forEach(delImg);added.filter(i=>!imgs.includes(i)).forEach(delImg);
      upsert(S.posts,{...v,id:p?p.id:uid(),imgs})},
    onDelete:p?()=>{(p.imgs||[]).forEach(delImg);remove(S.posts,p.id)}:null});
}
function ideaSheet(id){
  const i=S.ideas.find(x=>x.id===id);
  sheet({title:i?'Editar idea':'Nueva idea',required:'title',data:i||{project:ui.ideaF!=='Todas'?ui.ideaF:'Nexia',status:'Idea'},
    fields:[{k:'title',l:'Idea',ph:'Resúmela en pocas palabras'},{k:'project',l:'Para…',t:'select',o:IDEA_PROJ},{k:'status',l:'Estado',t:'select',o:['Idea','En marcha','Hecha']},{k:'note',l:'Detalles',t:'textarea',ph:'Desarróllala aquí…'}],
    onSave:v=>upsert(S.ideas,{...v,id:i?i.id:uid(),fav:i?i.fav:false}),onDelete:i?()=>remove(S.ideas,i.id):null});
}
function amountSheet(title,def,cb){
  sheet({title,data:{amount:def||''},fields:[{k:'amount',l:'Monto',t:'number',ph:'0.00'}],onSave:v=>{cb(v.amount)}});
}
function settingsSheet(){
  sheet({title:'Ajustes y respaldo',data:S.set,
    fields:[{k:'name',l:'Tu nombre',ph:'Para saludarte 🌸'},{k:'budget',l:'Presupuesto mensual de gastos',t:'number'}],
    extra:[{label:'🔄 Sincronización',fn:()=>{closeSheet();syncSheet()}},{label:'🔔 Activar avisos',fn:enableNotif},{label:'⬇️ Exportar respaldo',fn:exportData},{label:'⬆️ Importar respaldo',fn:()=>$('#file').click()}],
    onSave:v=>{S.set={...S.set,...v}}});

function exportData(){
  const b=new Blob([JSON.stringify({...S,_imgs:IMG})],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=`mi-espacio-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Respaldo descargado 💾');

$('#file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(x){toast('Archivo no válido');return}
    closeSheet();
    sheet({title:'Importar respaldo',pre:'<p class="note">Esto reemplazará todos tus datos actuales por los del archivo.</p>',fields:[],
      onSave:()=>{const im=d._imgs||{};delete d._imgs;S=Object.assign(structuredClone(DEF),d);Object.entries(im).forEach(([k,v])=>putImg(k,v));rebuildSnap();toast('Datos importados ✨')}})};
  r.readAsText(f);e.target.value='';
};

/* ============ Imágenes (IndexedDB) ============ */
const IMG={};let idb=null;
const idbOpen=()=>new Promise(res=>{try{const r=indexedDB.open('miespacio',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
const idbDo=(mode,fn)=>new Promise(res=>{if(!idb)return res();try{const tx=idb.transaction('img',mode),rq=fn(tx.objectStore('img'));tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>res()}catch(e){res()}});
async function loadImgs(){
  idb=await idbOpen();if(!idb)return;
  await new Promise(res=>{const tx=idb.transaction('img'),rq=tx.objectStore('img').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){IMG[c.key]=c.value;c.continue()}};tx.oncomplete=res;tx.onerror=res});
}
const putImg=(id,v)=>{IMG[id]=v;return idbDo('readwrite',st=>st.put(v,id))};
const delImg=id=>{delete IMG[id];return idbDo('readwrite',st=>st.delete(id))};

/* ============ Sincronización con GitHub ============ */
const SYNC_KEY='miespacio.sync';
let SY={};try{SY=JSON.parse(localStorage.getItem(SYNC_KEY)||'{}')}catch(e){}
const saveSY=()=>{try{localStorage.setItem(SYNC_KEY,JSON.stringify(SY))}catch(e){}};
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const hs=t=>{let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return h};
let syncing=false,syT;
const autoSync=()=>{if(SY.repo&&SY.token){clearTimeout(syT);syT=setTimeout(()=>sync(false),4000)}};
const ghUrl=()=>`https://api.github.com/repos/${SY.repo}/contents/${SY.path||'data/state.json'}`;
const ghHead=()=>({Authorization:'Bearer '+SY.token,Accept:'application/vnd.github+json'});
function merge(R){
  const del={...S.del};Object.entries(R.del||{}).forEach(([k,v])=>del[k]=Math.max(del[k]||0,v));
  COLL.forEach(c=>{
    const m=new Map(S[c].map(r=>[r.id,r]));
    (R[c]||[]).forEach(r=>{if(!r.id)return;r.u=r.u||Date.now();const l=m.get(r.id);if(!l||(l.u||0)<r.u)m.set(r.id,r)});
    S[c]=[...m.values()].filter(r=>!(del[r.id]>=(r.u||0)));
  });
  S.del=del;rebuildSnap();
}
async function sync(manual){
  if(!SY.repo||!SY.token){if(manual)syncSheet();return}
  if(syncing)return;syncing=true;
  try{
    for(let tries=0;tries<2;tries++){
      const br=SY.branch||'main';let sha;
      const g=await fetch(ghUrl()+'?ref='+encodeURIComponent(br),{headers:ghHead(),cache:'no-store'});
      if(g.status===200){const j=await g.json();sha=j.sha;merge(JSON.parse(unb64(j.content)))}
      else if(g.status!==404)throw new Error(g.status===401?'Token inválido':`GitHub respondió ${g.status}`);
      stamp();persist();
      const body=JSON.stringify({v:1,events:S.events,tx:S.tx,shop:S.shop,clients:S.clients,tasks:S.tasks,ideas:S.ideas,posts:S.posts,del:S.del},null,1);
      const h=hs(body);
      if(sha&&SY.sha===sha&&SY.h===h){SY.last=new Date().toISOString();SY.err='';saveSY();break}
      const pr=await fetch(ghUrl(),{method:'PUT',headers:ghHead(),body:JSON.stringify({message:'sync: datos de Mi Espacio',content:b64(body),branch:br,...(sha?{sha}:{})})});
      if(pr.status===200||pr.status===201){const j=await pr.json();SY.sha=j.content.sha;SY.h=h;SY.last=new Date().toISOString();SY.err='';saveSY();break}
      if(pr.status===409||pr.status===422){if(tries===0)continue}
      throw new Error(pr.status===404?'No encuentro el repositorio o la rama':pr.status===403?'El token no tiene permiso de escritura':`No se pudo guardar (${pr.status})`);
    }
    render();if(manual)toast('Sincronizado ✨');
  }catch(e){SY.err=String(e.message||e);saveSY();if(manual)toast(SY.err)}
  finally{syncing=false}
}
function syncSheet(){
  const st=SY.err?`⚠️ ${esc(SY.err)}`:SY.last?`Última sincronización: ${new Date(SY.last).toLocaleString('es')}`:'Aún sin sincronizar';
  sheet({title:'Sincronización',data:SY,
    pre:`<p class="note">Guarda tus datos en tu repositorio de GitHub para que se vean en todos tus dispositivos, y para que Claude y las alertas automáticas puedan leerlos. Necesitas un <b>token</b> de GitHub (Fine-grained, solo este repositorio, permiso <i>Contents: Read and write</i>).<br>${st}</p>`,
    fields:[{k:'repo',l:'Repositorio',ph:'usuario/mi-primer-proyecto'},{k:'branch',l:'Rama',ph:'main'},{k:'token',l:'Token de GitHub',ph:'github_pat_…'},{k:'path',l:'Archivo de datos',ph:'data/state.json'}],
    onSave:v=>{SY={...SY,...v};if(!SY.branch)SY.branch='main';if(!SY.path)SY.path='data/state.json';saveSY();setTimeout(()=>sync(true),50)}});
}
async function enableNotif(){
  if(!('Notification' in window)){toast('Tu navegador no permite avisos');return}
  const r=await Notification.requestPermission();toast(r==='granted'?'Avisos activados 🔔':'Avisos bloqueados');
  if(r==='granted')notifyOnce();
}

/* ============ Eventos ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case 'close':closeSheet();break;
    case 'tab':ui.tab=id;render();scrollTo(0,0);break;
    case 'settings':settingsSheet();break;
    case 'add-ev':evSheet(null,id);break;
    case 'edit-ev':evSheet(id);break;
    case 'add-task':taskSheet(null,id,el.dataset.due);break;
    case 'edit-task':taskSheet(id);break;
    case 'toggle':{
      if(el.dataset.kind==='post'){const x=S.posts.find(x=>x.id===id);x.status=x.status==='Publicado'?'Por subir':'Publicado'}
      else if(el.dataset.kind==='task'){const t=S.tasks.find(x=>x.id===id);t.done=!t.done}
      else{const ev=S.events.find(x=>x.id===id);ev.doneOn=ev.doneOn||{};ev.doneOn[el.dataset.d]=!ev.doneOn[el.dataset.d]}
      save();render();break}
    case 'cal-prev':ui.cal=shiftM(ui.cal,-1);render();break;
    case 'cal-next':ui.cal=shiftM(ui.cal,1);render();break;
    case 'pickday':ui.sel=id;render();break;
    case 'm-prev':ui.month=shiftM(ui.month,-1);render();break;
    case 'm-next':ui.month=shiftM(ui.month,1);render();break;
    case 'goto-month':ui.month=id;render();scrollTo(0,0);break;
    case 'add-tx':txSheet(null,id);break;
    case 'edit-tx':txSheet(id);break;
    case 'budget':amountSheet('Presupuesto mensual de gastos',S.set.budget,n=>{S.set.budget=n});break;
    case 'shop-toggle':{const s=S.shop.find(x=>x.id===id);s.done=!s.done;save();render();break}
    case 'edit-shop':shopSheet(id);break;
    case 'shop-fav':{const f=S.favs.find(x=>x.name===el.dataset.n);S.shop.unshift({id:uid(),name:f.name,cat:f.cat,qty:'',done:false});save();render();break}
    case 'shop-clear':{
      const done=S.shop.filter(s=>s.done);if(!done.length){toast('Nada marcado aún');break}
      done.forEach(s=>{if(!S.favs.some(f=>f.name.toLowerCase()===s.name.toLowerCase()))S.favs.unshift({name:s.name,cat:s.cat})});
      S.favs=S.favs.slice(0,40);S.shop=S.shop.filter(s=>!s.done);save();render();toast('Lista limpia 🧹');break}
    case 'shop-expense':{
      amountSheet('¿Cuánto gastaste en el súper?','',n=>{if(!n)return false;
        S.tx.unshift({id:uid(),type:'gasto',amount:n,cat:'Super',desc:'Compra del súper',date:today()});toast('Gasto registrado 🛒')});break}
    case 'proj':ui.proj=id;ui.fclient='';render();break;
    case 'add-client':clientSheet();break;
    case 'edit-client':clientSheet(id);break;
    case 'ideas-of':ui.ideaF=id;ui.tab='ideas';render();scrollTo(0,0);break;
    case 'add-post':postSheet();break;
    case 'edit-post':postSheet(id);break;
    case 'adv':{const x=S.posts.find(x=>x.id===id);x.status=NEXT[x.status];save();render();toast(`→ ${x.status}`);break}
    case 'fclient':ui.fclient=id;render();break;
    case 'fstatus':ui.fstatus=id;render();break;
    case 'feed-of':ui.proj=id;ui.fclient='';ui.tab='feed';render();scrollTo(0,0);break;
    case 'sync':sync(true);break;
    case 'ideaf':ui.ideaF=id;render();break;
    case 'add-idea':ideaSheet();break;
    case 'edit-idea':ideaSheet(id);break;
    case 'star':{e.stopPropagation();const i=S.ideas.find(x=>x.id===id);i.fav=!i.fav;save();render();break}
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='shopForm')return;
  e.preventDefault();
  const n=e.target.n.value.trim();if(!n)return;
  S.shop.unshift({id:uid(),name:n,cat:e.target.c.value,qty:'',done:false});save();render();
  const i=document.querySelector('#shopForm input');i&&i.focus();
});

render();
loadImgs().then(()=>{render();notifyOnce()});
sync(false);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync(false)});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
